    <rect x="370" y="320" width="290" height="410" fill="url(#greenUp)" opacity=".6"/>
    <ellipse cx="468" cy="500" rx="80" ry="60" fill="#3dff9a" opacity=".14" filter="url(#b20)"/>
    <ellipse cx="556" cy="500" rx="80" ry="60" fill="#3dff9a" opacity=".14" filter="url(#b20)"/>
    <!-- tempie e zigomi -->
    <ellipse cx="392" cy="505" rx="26" ry="60" fill="#1a160f" opacity=".75" filter="url(#b8)"/>
    <ellipse cx="632" cy="505" rx="26" ry="60" fill="#1a160f" opacity=".85" filter="url(#b8)"/>
    <path d="M430 612 C440 640 452 660 470 676" stroke="#120f0a" stroke-width="22" fill="none" opacity=".7" filter="url(#b8)"/>
    <path d="M594 612 C584 640 572 660 554 676" stroke="#120f0a" stroke-width="22" fill="none" opacity=".8" filter="url(#b8)"/>
    <path d="M410 590 C430 600 450 600 470 590" stroke="#e8dfc5" stroke-width="6" fill="none" opacity=".45" filter="url(#b3)"/>
