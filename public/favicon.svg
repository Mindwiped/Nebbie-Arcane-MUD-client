    <g fill="none" stroke="#1c170f" stroke-linecap="round" stroke-linejoin="round">
      <path d="M560 336 L548 368 L562 392 L550 420 L558 438" stroke-width="3.5"/>
      <path d="M562 392 L584 404" stroke-width="2.5"/>
      <path d="M430 380 L446 404 L438 424" stroke-width="2.5"/>
    </g>
    <path d="M561 338 L549 368 L563 392" fill="none" stroke="#f5edd8" stroke-width="1.5" opacity=".5" transform="translate(2 1)"/>
    <!-- luce di taglio da sinistra -->
    <rect x="370" y="320" width="290" height="410" fill="url(#sideShade)"/>
    <!-- ombra sotto la corona e sotto le orbite -->
    <path d="M380 430 Q512 400 644 430 L644 470 Q512 440 380 470 Z" fill="#000" opacity=".35" filter="url(#b8)"/>
    <!-- ombra ai bordi -->
    <rect x="370" y="320" width="290" height="410" fill="url(#boneVig)"/>
  </g>

  <!-- orbite -->
  <path d="M418 478 C432 456 470 452 502 472 C510 488 504 518 488 532 C466 546 432 538 420 516 C412 502 412 490 418 478 Z" fill="url(#socket)"/>
  <path d="M606 478 C592 456 554 452 522 472 C514 488 520 518 536 532 C558 546 592 538 604 516 C612 502 612 490 606 478 Z" fill="url(#socket)"/>
