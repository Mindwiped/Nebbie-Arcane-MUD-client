  <path d="M418 478 C432 456 470 452 502 472 C510 488 504 518 488 532 C466 546 432 538 420 516 C412 502 412 490 418 478 Z" fill="none" stroke="#000" stroke-width="8" opacity=".7" filter="url(#b3)"/>
  <path d="M606 478 C592 456 554 452 522 472 C514 488 520 518 536 532 C558 546 592 538 604 516 C612 502 612 490 606 478 Z" fill="none" stroke="#000" stroke-width="8" opacity=".7" filter="url(#b3)"/>
  <g filter="url(#b20)"><circle cx="463" cy="498" r="26" fill="#3dff9a" opacity=".9"/><circle cx="561" cy="498" r="26" fill="#3dff9a" opacity=".9"/></g>
  <circle cx="463" cy="498" r="14" fill="url(#eyeCore)"/>
  <circle cx="561" cy="498" r="14" fill="url(#eyeCore)"/>
  <path d="M440 488 Q463 482 486 492" stroke="#eafff3" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M584 488 Q561 482 538 492" stroke="#eafff3" stroke-width="2" fill="none" opacity=".6"/>

  <!-- cavità nasale -->
  <path d="M512 548 C504 560 494 582 496 600 C502 602 508 598 512 592 C516 598 522 602 528 600 C530 582 520 560 512 548 Z" fill="#040304"/>
  <path d="M512 552 C506 564 500 580 500 594" stroke="#8a7e62" stroke-width="2" fill="none" opacity=".6"/>

  <!-- bocca e denti -->
  <path d="M460 634 Q512 650 564 634 L558 680 Q512 694 466 680 Z" fill="#030203"/>
  <g stroke="#1b160f" stroke-width="2">
    <path d="M466 634 h11 v20 q-5.5 5 -11 0 z" fill="url(#tooth)"/>
    <path d="M478 638 h11 v24 q-5.5 5 -11 0 z" fill="url(#tooth)"/>
    <path d="M490 640 h10 v27 q-5 5 -10 0 z" fill="url(#tooth)"/>
    <path d="M501 641 h10.5 v26 q-5 5 -10.5 0 z" fill="url(#tooth)"/>
    <path d="M512.5 641 h10.5 v27 q-5 5 -10.5 0 z" fill="url(#tooth)"/>
    <path d="M524 640 h10 v23 q-5 5 -10 0 z" fill="url(#tooth)"/>
    <path d="M535 638 h11 v25 q-5.5 5 -11 0 z" fill="url(#tooth)"/>
    <path d="M547 634 h11 v18 q-5.5 5 -11 0 z" fill="url(#tooth)"/>
    <path d="M476 682 v-12 q5 -5 10 0 v13 z" fill="url(#tooth)"/>
    <path d="M488 685 v-14 q5 -5 10 0 v15 z" fill="url(#tooth)"/>
    <path d="M526 686 v-14 q5 -5 10 0 v13 z" fill="url(#tooth)"/>
    <path d="M538 683 v-12 q5 -5 10 0 v11 z" fill="url(#tooth)"/>
  </g>

  <!-- corona di ferro -->
  <g>
    <path d="M398 404 L404 330 L426 380 L440 288 L462 372 L480 258 L498 360 L512 228 L526 360 L544 258 L562 372 L584 288 L598 380 L620 330 L626 404 Q512 380 398 404 Z" fill="url(#iron)" stroke="#08080b" stroke-width="4" stroke-linejoin="miter"/>
    <g stroke="#b7bccb" stroke-width="2.5" opacity=".55" fill="none">
      <path d="M404 334 L408 398"/><path d="M440 292 L436 388"/><path d="M480 262 L476 384"/><path d="M512 232 L508 382"/>
    </g>
    <g stroke="#3dff9a" stroke-width="2.5" opacity=".45" fill="none" filter="url(#b3)">
      <path d="M544 262 L560 370"/><path d="M584 292 L596 378"/><path d="M620 334 L624 398"/>
    </g>
    <path d="M396 404 Q512 378 628 404 L626 428 Q512 402 398 428 Z" fill="url(#iron)" stroke="#08080b" stroke-width="3"/>
    <path d="M400 408 Q512 384 624 408" stroke="#9aa0b2" stroke-width="2" fill="none" opacity=".6"/>
    <g fill="#3dff9a" opacity=".75">
      <circle cx="440" cy="414" r="3"/><circle cx="470" cy="408" r="3"/><circle cx="554" cy="408" r="3"/><circle cx="584" cy="414" r="3"/>
    </g>
    <g filter="url(#b8)"><path d="M512 372 L532 400 L512 428 L492 400 Z" fill="#3dff9a"/></g>
    <path d="M512 376 L529 400 L512 424 L495 400 Z" fill="#7dffbf" stroke="#0b3f27" stroke-width="3"/>
    <path d="M512 380 L522 398 L512 402 Z" fill="#e9fff4" opacity=".8"/>
  </g>

  <!-- braci necrotiche -->
  <g fill="#8dffc4">
    <circle cx="262" cy="330" r="3.5" opacity=".6"/><circle cx="770" cy="290" r="3" opacity=".55"/>
    <circle cx="306" cy="560" r="2.5" opacity=".45"/><circle cx="742" cy="520" r="3.5" opacity=".5"/>
    <circle cx="660" cy="232" r="2.5" opacity=".45"/><circle cx="370" cy="214" r="3" opacity=".45"/>
  </g>

  <!-- nebbia -->
  <g filter="url(#mist)">
    <ellipse cx="300" cy="830" rx="340" ry="70" fill="#a9d8c4" opacity=".4"/>
    <ellipse cx="760" cy="800" rx="320" ry="60" fill="#b7e2cf" opacity=".35"/>
    <ellipse cx="520" cy="910" rx="520" ry="100" fill="#d6efe3" opacity=".6"/>
